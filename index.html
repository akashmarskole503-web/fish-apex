<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fish Marketplace - मछली बाजार</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f0f4f8; color: #333; padding-bottom: 50px; }
    header { background: linear-gradient(135deg, #0288d1, #01579b); color: white; text-align: center; padding: 25px 15px; }
    header h1 { font-size: 24px; margin-bottom: 5px; }
    .container { max-width: 700px; margin: 15px auto; padding: 0 12px; }
    
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 12px; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; background: #e1f5fe; color: #0277bd; transition: 0.2s; }
    .tab-btn.active { background: #0288d1; color: white; }

    .card { background: white; border-radius: 10px; padding: 18px; margin-bottom: 15px; box-shadow: 0 3px 8px rgba(0,0,0,0.06); }
    h2 { font-size: 18px; color: #01579b; margin-bottom: 12px; border-bottom: 2px solid #e1f5fe; padding-bottom: 6px; }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    
    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-green { background-color: #25d366; color: white; }
    .btn-blue { background-color: #0288d1; color: white; }
    .btn-red { background-color: #e53935; color: white; margin-top: 10px; }

    .product-card { border: 1px solid #b3e5fc; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa; }
    .product-card h3 { font-size: 17px; color: #0277bd; }
    .badge { display: inline-block; background: #e0f2f1; color: #00796b; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; margin: 4px 0; }
    .seller-info { font-size: 13px; color: #666; margin: 6px 0; }
    .price-tag { font-size: 16px; font-weight: bold; color: #e65100; margin: 4px 0; }
  </style>
</head>
<body>

  <header>
    <h1>🐟 ऑनलाइन मछली बाजार (Marketplace)</h1>
    <p>स्थानीय विक्रेताओं से सीधे ताज़ा मछली खरीदें या बेचें</p>
  </header>

  <div class="container">
    <div class="nav-tabs">
      <button class="tab-btn active" id="btn-market" onclick="switchTab('market')">🛒 मछली खरीदें (Market)</button>
      <button class="tab-btn" id="btn-seller" onclick="switchTab('seller')">💼 विक्रेता लॉगिन (Seller Panel)</button>
    </div>

    <!-- 1. BUYER MARKETPLACE VIEW -->
    <div id="market-view">
      <div class="card">
        <h2>उपलब्ध ताज़ा मछली (Available Listings)</h2>
        <div id="product-list">
          <!-- Products load here dynamically -->
        </div>
      </div>
    </div>

    <!-- 2. SELLER LOGIN & DASHBOARD VIEW -->
    <div id="seller-view" style="display: none;">
      <!-- Auth Screen -->
      <div class="card" id="seller-auth">
        <h2>विक्रेता लॉगिन / नया खाता (Seller Login)</h2>
        <div class="form-group">
          <label>विक्रेता/दुकान का नाम</label>
          <input id="seller-name" placeholder="उदा. आकाश फिश सेंटर">
        </div>
        <div class="form-group">
          <label>WhatsApp मोबाइल नंबर (10 अंक)</label>
          <input id="seller-phone" type="tel" placeholder="8305314285">
        </div>
        <div class="form-group">
          <label>क्षेत्र / शहर (Location)</label>
          <input id="seller-loc" placeholder="उदा. सिवनी / बरघाट">
        </div>
        <button class="btn btn-blue" onclick="loginSeller()">डैशबोर्ड में प्रवेश करें</button>
      </div>

      <!-- Dashboard Screen -->
      <div class="card" id="seller-dashboard" style="display: none;">
        <h2>➕ अपनी मछली लिस्ट करें (Add Fish Item)</h2>
        <p style="font-size: 13px; color: green; margin-bottom: 10px;">लॉगिन: <b id="dash-seller-name"></b> (<span id="dash-seller-phone"></span>)</p>

        <div class="form-group">
          <label>मछली का नाम</label>
          <input id="item-fish" placeholder="उदा. ताज़ा रोहू / कतला / झींगा">
        </div>
        <div class="form-group">
          <label>कीमत (Price प्रति किलो)</label>
          <input id="item-price" type="number" placeholder="उदा. 220">
        </div>
        <div class="form-group">
          <label>सफाई / कटिंग विवरण</label>
          <select id="item-cleaning">
            <option value="साफ़ और कटिंग उपलब्ध">साफ़ और कटिंग उपलब्ध</option>
            <option value="केवल साबुत मछली (Whole)">केवल साबुत मछली (Whole)</option>
          </select>
        </div>
        <button class="btn btn-green" onclick="addProduct()">मछली लिस्ट करें (Publish)</button>
        <button class="btn btn-red" onclick="logoutSeller()">लॉगआउट करें</button>
      </div>
    </div>
  </div>

  <script>
    // Demo Initial Data
    const defaultProducts = [
      { id: 1, fish: "रोहू (Rohu)", price: "240", cleaning: "साफ़ और कटिंग उपलब्ध", seller: "आकाश फिश स्टोर", phone: "918305314285", loc: "सिवनी" },
      { id: 2, fish: "कतला (Katla)", price: "280", cleaning: "साफ़ और कटिंग उपलब्ध", seller: "बरघाट फिश फार्म", phone: "918305314285", loc: "बरघाट" }
    ];

    let products = JSON.parse(localStorage.getItem("fish_marketplace_items")) || defaultProducts;
    let currentSeller = JSON.parse(localStorage.getItem("current_seller")) || null;

    function renderProducts() {
      const container = document.getElementById("product-list");
      if (products.length === 0) {
        container.innerHTML = "<p style='color:#777; text-align:center;'>अभी कोई मछली उपलब्ध नहीं है।</p>";
        return;
      }

      container.innerHTML = products.map(item => `
        <div class="product-card">
          <h3>🐟 ${item.fish}</h3>
          <div class="price-tag">₹${item.price} / किलो</div>
          <span class="badge">📍 ${item.loc}</span>
          <span class="badge">🔪 ${item.cleaning}</span>
          <div class="seller-info">विक्रेता: <b>${item.seller}</b></div>
          <button class="btn btn-green" style="margin-top:8px;" onclick="orderViaWhatsApp('${item.seller}', '${item.phone}', '${item.fish}', '${item.price}')">
            📱 सीधे इस विक्रेता से WhatsApp पर खरीदें
          </button>
        </div>
      `).join('');
    }

    function switchTab(tab) {
      if (tab === 'market') {
        document.getElementById("market-view").style.display = "block";
        document.getElementById("seller-view").style.display = "none";
        document.getElementById("btn-market").classList.add("active");
        document.getElementById("btn-seller").classList.remove("active");
        renderProducts();
      } else {
        document.getElementById("market-view").style.display = "none";
        document.getElementById("seller-view").style.display = "block";
        document.getElementById("btn-market").classList.remove("active");
        document.getElementById("btn-seller").classList.add("active");
        checkSellerAuth();
      }
    }

    function loginSeller() {
      const name = document.getElementById("seller-name").value.trim();
      let phone = document.getElementById("seller-phone").value.trim();
      const loc = document.getElementById("seller-loc").value.trim();

      if (!name || !phone || !loc) {
        alert("कृपया सभी विवरण भरें!");
        return;
      }
      if (phone.length === 10) phone = "91" + phone;

      currentSeller = { name, phone, loc };
      localStorage.setItem("current_seller", JSON.stringify(currentSeller));
      checkSellerAuth();
    }

    function checkSellerAuth() {
      if (currentSeller) {
        document.getElementById("seller-auth").style.display = "none";
        document.getElementById("seller-dashboard").style.display = "block";
        document.getElementById("dash-seller-name").innerText = currentSeller.name;
        document.getElementById("dash-seller-phone").innerText = currentSeller.phone;
      } else {
        document.getElementById("seller-auth").style.display = "block";
        document.getElementById("seller-dashboard").style.display = "none";
      }
    }

    function addProduct() {
      const fish = document.getElementById("item-fish").value.trim();
      const price = document.getElementById("item-price").value.trim();
      const cleaning = document.getElementById("item-cleaning").value;

      if (!fish || !price) {
        alert("मछली का नाम और कीमत भरें!");
        return;
      }

      const newProduct = {
        id: Date.now(),
        fish,
        price,
        cleaning,
        seller: currentSeller.name,
        phone: currentSeller.phone,
        loc: currentSeller.loc
      };

      products.unshift(newProduct);
      localStorage.setItem("fish_marketplace_items", JSON.stringify(products));

      document.getElementById("item-fish").value = "";
      document.getElementById("item-price").value = "";
      alert("मछली सफलतापूर्वक लिस्ट हो गई!");
      switchTab('market');
    }

    function logoutSeller() {
      localStorage.removeItem("current_seller");
      currentSeller = null;
      checkSellerAuth();
    }

    function orderViaWhatsApp(sellerName, sellerPhone, fishName, price) {
      const msg = `नमस्ते ${sellerName}!%0A%0Aमुझे ऑनलाइन मछली बाजार से आपकी लिस्टिंग देखकर मछली खरीदनी है:%0A▫️ मछली: ${fishName}%0A▫️ दर: ₹${price}/kg%0A%0Aकृपया बताएं कि डिलीवरी कैसे मिलेगी?`;
      window.open(`https://api.whatsapp.com/send?phone=${sellerPhone}&text=${msg}`, "_blank");
    }

    // Initialize
    renderProducts();
  </script>
</body>
</html>
